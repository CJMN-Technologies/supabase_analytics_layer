name: LRT2 Daily ML Forecasting

on:
  schedule:
    # Run daily at 8:00 PM UTC (4:00 AM Manila Time) to pre-populate predictions before train operations start
    - cron: '0 20 * * *'
  workflow_dispatch: # Allows manual trigger from the GitHub web UI

jobs:
  run-forecaster:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip' # Speeds up execution by caching python packages

      - name: Install Python Dependencies
        run: |
          if [ -f "Analytics/requirements.txt" ]; then
            pip install -r Analytics/requirements.txt
          elif [ -f "requirements.txt" ]; then
            pip install -r requirements.txt
          fi

      # Run model training & baseline forecast calculation
      - name: Run ML Training & Forecast
        env:
          DB_HOST: "aws-1-ap-southeast-1.pooler.supabase.com"
          DB_PORT: "5432"
          DB_NAME: "postgres"
          DB_USER: "postgres.kthioobzfyepokrrykem"
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        run: |
          if [ -d "Analytics/Analytics Layer" ]; then
            cd Analytics
            python "Analytics Layer/model training, testing and validation/train_and_validate.py"
          else
            python "Analytics Layer/model training, testing and validation/train_and_validate.py"
          fi
